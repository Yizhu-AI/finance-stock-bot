name: Daily Stock Signal Digest

on:
  schedule:
    # 13:30 UTC = 9:30 AM Eastern (market open) on weekdays.
    # Adjust for your timezone / when you want the digest.
    - cron: '30 13 * * 1-5'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab, for testing

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal bot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          SIM_STARTING_CAPITAL: ${{ secrets.SIM_STARTING_CAPITAL }}
          LLM_REQUEST_DELAY_SECONDS: ${{ secrets.LLM_REQUEST_DELAY_SECONDS }}
          CRITIC_REQUEST_DELAY_SECONDS: ${{ secrets.CRITIC_REQUEST_DELAY_SECONDS }}
        run: python main.py
