name: Daily Stock Signal Digest

on:
  # Automated scheduling turned off deliberately (see git history for the
  # cron expression this replaced: hourly, 9am-5pm Eastern, weekdays). Add
  # a `schedule:` block back to resume. workflow_dispatch still lets you
  # trigger a one-off run manually from the Actions tab or `gh workflow run`.
  workflow_dispatch: {}

permissions:
  contents: write   # needed for the "Persist signal history" step below to push

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal bot
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          SIM_STARTING_CAPITAL: ${{ secrets.SIM_STARTING_CAPITAL }}
          LLM_REQUEST_DELAY_SECONDS: ${{ secrets.LLM_REQUEST_DELAY_SECONDS }}
          INTRA_TICKER_REQUEST_DELAY_SECONDS: ${{ secrets.INTRA_TICKER_REQUEST_DELAY_SECONDS }}
          GLOBAL_TOOL_CALL_BUDGET: ${{ secrets.GLOBAL_TOOL_CALL_BUDGET }}
        run: python main.py

      - name: Persist signal history
        # GitHub Actions runners are ephemeral — without this, every run's
        # signal/trade history would be written to a disk that's thrown
        # away seconds later, and the next run would never see it. See
        # "Persistent history across GitHub Actions runs" in the README.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signal_history.db
          if git diff --staged --quiet; then
            echo "No changes to signal_history.db"
          else
            git commit -m "Update signal history [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
